<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1230" viewBox="0 0 720 1230" role="img" aria-labelledby="title desc">
  <title id="title">Game Design Skill: find what's broken in your game design</title>
  <desc id="desc">One skill, nine design lenses and a report that ranks issues and proposes the smallest fix. Flow: your material (concept, pitch deck, GDD or playtest notes) goes to a router that fills gaps and picks one to five lenses, for example core loop, flow and failure, and FTUE and retention, then returns a prioritized report with P1 to P3 issues. Report rows are illustrative.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 H 0 V 28" fill="none" stroke="#23433f" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1L7 5L2 9" fill="none" stroke="#6b998b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="1230" rx="24" fill="#f3efe6"/>
  <path d="M0 590H720V1206Q720 1230 696 1230H24Q0 1230 0 1206Z" fill="#102d2a"/>
  <path d="M0 590H720V1206Q720 1230 696 1230H24Q0 1230 0 1206Z" fill="url(#grid)" opacity=".48"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="40" y="48" width="38" height="38" rx="10" fill="#172c2a"/>
    <path d="M51 67H67M59 59V75" stroke="#f3efe6" stroke-width="2.8" stroke-linecap="round"/>
    <text x="94" y="75" fill="#213a36" font-size="20" font-weight="700" letter-spacing="2">GAME DESIGN SKILL</text>

    <text x="40" y="190" fill="#152d29" font-size="58" font-weight="750" letter-spacing="-2">Find what&#8217;s broken</text>
    <text x="40" y="258" fill="#152d29" font-size="58" font-weight="750" letter-spacing="-2">in your game design.</text>
    <text x="42" y="318" fill="#455851" font-size="27">One skill. Nine design lenses.</text>
    <text x="42" y="356" fill="#455851" font-size="27">A report that ranks issues and</text>
    <text x="42" y="394" fill="#455851" font-size="27">proposes the smallest fix.</text>
    <line x1="42" y1="430" x2="678" y2="430" stroke="#d2d7cd"/>

    <text x="42" y="490" fill="#ad5f3c" font-size="44" font-weight="750" letter-spacing="-1">9</text>
    <text x="42" y="520" fill="#53645b" font-size="18">design lenses</text>
    <text x="250" y="490" fill="#ad5f3c" font-size="44" font-weight="750" letter-spacing="-1">&#8804;3</text>
    <text x="250" y="520" fill="#53645b" font-size="18">intake questions</text>
    <text x="466" y="490" fill="#ad5f3c" font-size="44" font-weight="750" letter-spacing="-1">P1&#8211;P3</text>
    <text x="466" y="520" fill="#53645b" font-size="18">ranked fixes</text>

    <text x="42" y="562" fill="#53645b" font-size="15" font-weight="600" letter-spacing="1.3">CLAUDE CODE PLUGIN &#183; CODEX SKILL &#183; SKILL.md &#183; MIT</text>

    <text x="40" y="646" fill="#a8c7bd" font-size="16" font-weight="700" letter-spacing="2">1  YOUR MATERIAL</text>
    <g font-size="18" text-anchor="middle" fill="#e6eee6">
      <rect x="40" y="664" width="134" height="42" rx="11" fill="#1d413b" stroke="#3d6a60"/>
      <text x="107" y="691">Concept</text>
      <rect x="186" y="664" width="148" height="42" rx="11" fill="#1d413b" stroke="#3d6a60"/>
      <text x="260" y="691">Pitch deck</text>
      <rect x="346" y="664" width="104" height="42" rx="11" fill="#1d413b" stroke="#3d6a60"/>
      <text x="398" y="691">GDD</text>
      <rect x="462" y="664" width="218" height="42" rx="11" fill="#1d413b" stroke="#3d6a60"/>
      <text x="571" y="691">Playtest notes</text>
    </g>
    <path d="M360 714V736" stroke="#6b998b" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="40" y="762" fill="#a8c7bd" font-size="16" font-weight="700" letter-spacing="2">2  ROUTER</text>
    <rect x="40" y="774" width="640" height="54" rx="13" fill="#f0d5c2"/>
    <circle cx="66" cy="801" r="7" fill="#ad5f3c"/>
    <text x="86" y="808" fill="#5c3728" font-size="20" font-weight="600">Fills gaps, then picks the 1&#8211;5 lenses that matter</text>
    <path d="M360 836V858" stroke="#6b998b" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="40" y="884" fill="#a8c7bd" font-size="16" font-weight="700" letter-spacing="2">3  NINE LENSES</text>
    <g font-size="17" text-anchor="middle">
      <rect x="40" y="896" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="142" y="921" fill="#a8c7bd">Emotion</text>
      <rect x="258" y="896" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="360" y="921" fill="#a8c7bd">Motivation</text>
      <rect x="476" y="896" width="204" height="38" rx="10" fill="#f0d5c2"/>
      <text x="578" y="921" fill="#5c3728" font-weight="700">Core loop</text>
      <rect x="40" y="944" width="204" height="38" rx="10" fill="#f0d5c2"/>
      <text x="142" y="969" fill="#5c3728" font-weight="700">Flow &amp; failure</text>
      <rect x="258" y="944" width="204" height="38" rx="10" fill="#f0d5c2"/>
      <text x="360" y="969" fill="#5c3728" font-weight="700">FTUE &amp; retention</text>
      <rect x="476" y="944" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="578" y="969" fill="#a8c7bd">Social</text>
      <rect x="40" y="992" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="142" y="1017" fill="#a8c7bd">Prototyping</text>
      <rect x="258" y="992" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="360" y="1017" fill="#a8c7bd">Pitch &amp; GDD</text>
      <rect x="476" y="992" width="204" height="38" rx="10" fill="none" stroke="#3d6a60"/>
      <text x="578" y="1017" fill="#a8c7bd">Scope &amp; budget</text>
    </g>
    <path d="M360 1038V1060" stroke="#6b998b" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="40" y="1086" fill="#a8c7bd" font-size="16" font-weight="700" letter-spacing="2">4  PRIORITIZED REPORT</text>
    <rect x="40" y="1098" width="640" height="104" rx="13" fill="#fffdf8"/>
    <g font-size="14" font-weight="700" text-anchor="middle" fill="#fffdf8">
      <rect x="58" y="1110" width="44" height="24" rx="6" fill="#ad5f3c"/>
      <text x="80" y="1127">P1</text>
      <rect x="58" y="1139" width="44" height="24" rx="6" fill="#b9822f"/>
      <text x="80" y="1156">P2</text>
      <rect x="58" y="1168" width="44" height="24" rx="6" fill="#5f8a7d"/>
      <text x="80" y="1185">P3</text>
    </g>
    <g font-size="18" fill="#213a36">
      <text x="118" y="1128">Loop can&#8217;t finish in one session</text>
      <text x="118" y="1157">Failure costs too much time</text>
      <text x="118" y="1186">Tutorial text runs long</text>
    </g>
    <g font-size="14" fill="#6b7b72" text-anchor="end">
      <text x="662" y="1128">fix &#183; S</text>
      <text x="662" y="1157">fix &#183; S</text>
      <text x="662" y="1186">fix &#183; M</text>
    </g>
  </g>
</svg>
